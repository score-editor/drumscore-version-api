# The Drum Score Editor help site: static pages, built by score-editor/drumscore-docs
# (build/build.py) and copied to ./docs-site on this host. Included from the
# support.drumscore.scot server block; the application opens
#   https://support.drumscore.scot/docs/go/v4/<lang>/<topic>/
# and that page sends the reader on to the topic's page (drumscore-editor #828).
#
# Nothing here is proxied to the API, and nothing here is written by a request.

location = /docs {
    return 301 /docs/;
}

location /docs/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ =404;

    # A directory asked for without its slash is redirected by path alone: behind
    # Cloudflare this server does not know the address the reader typed.
    absolute_redirect off;

    # A page is its HTML, a stylesheet and its pictures at once, so the API's
    # one-a-second limit would refuse an ordinary reader. `limit_req` here replaces
    # the server's; `expires` is used rather than add_header, which would drop the
    # server's security headers from these responses. How long is in nginx.conf
    # ($docs_expires): pages a few minutes, everything else an hour.
    limit_req zone=docs_limit burst=60 nodelay;
    expires $docs_expires;
}
